[project]
name = "hello-nim"
version = "0.1.0"
description = "Example: a Python package with a Nim extension module and a Nim CLI, built with nimlang."
requires-python = ">=3.9"
dependencies = []

[build-system]
requires = ["hatchling", "nimlang"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.nimlang]
extensions = ["src/hello_nim/nimcore.nim"]
binaries = ["src/hello_nim/hello_nim_cli.nim"]

[tool.nimlang]
dependencies = ["nimpy"]

[tool.uv]
# Rebuild the editable install (and so the Nim extension) when Nim sources change.
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.nim" }]

[dependency-groups]
dev = ["nimlang", "pytest"]
